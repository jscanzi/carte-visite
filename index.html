<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Romain Legresy — Inqom</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Romain Legresy">
<meta name="theme-color" content="#FAF8F5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* Matter — police de marque Inqom. Licence Displaay « Web » au nom d'Inqom
     (facture DP15269), qui autorise l'auto-hébergement en @font-face.
     Fichier livré tel quel par la fonderie : ne pas convertir ni sous-ensembler,
     la licence l'interdit explicitement.
     Variante « Uprights » : pas d'italiques sur la carte, 178 ko au lieu de 260. */
  @font-face{
    font-family:'Matter VF';
    src:url('assets/MatterUprightsVF.woff2') format('woff2-variations');
    font-weight:100 1000;
    font-style:normal;
    font-display:swap;
  }


  /* ===================== Charte Inqom ===================== */
  :root{
    --aubergine:#2A0F2E;      /* signature — fond recto */
    --raisin:#1E0921;         /* structure */
    --creme:#FAF8F5;          /* fond d'écran */
    --bloom-vif:#B28FE0;      /* accent — intitulé de poste */
    --lilas:#A381CC;          /* fond verso */
    --blanc:#FFFFFF;

    /* Repli système si Matter n'a pas chargé — plus aucune requête externe. */
    --police:'Matter VF',-apple-system,BlinkMacSystemFont,'SF Pro Text',
             'Helvetica Neue',Arial,sans-serif;

    /* Zéro arrondi : convention Inqom, alignée sur la newsletter et le deck. */
    --rayon:0px;

    /* Largeur de la carte. Tout le reste en dérive. */
    --u:min(78vw, 340px, calc(62vh * 0.6474));


  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--creme); color:var(--aubergine);
    font:400 16px/1.4 var(--police);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(18px,4.5vh,34px);
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }

  /* ===================== Entrée ===================== */
  @keyframes entree{
    from{opacity:0; transform:perspective(1200px) translateY(22px) scale(.955) rotateX(-10deg)}
    to  {opacity:1; transform:perspective(1200px) translateY(0)    scale(1)    rotateX(0deg)}
  }
  @keyframes monte{from{opacity:0; transform:translateY(11px)} to{opacity:1; transform:none}}
  @keyframes balayage{
    0%{transform:translateX(-160%) skewX(-14deg); opacity:0}
    22%{opacity:.7} 78%{opacity:.7}
    100%{transform:translateX(210%) skewX(-14deg); opacity:0}
  }
  /* Pas de preserve-3d ici : ce bloc anime l'opacité, il doit rester
     HORS du contexte 3D de la carte (voir CAUSE 1 en commentaire du HTML). */
  .entree{animation:entree 1s cubic-bezier(.16,1,.3,1) both}

  /* ===================== Carte ===================== */
  .scene{perspective:1500px; perspective-origin:50% 45%}
  .pivot{
    position:relative; width:var(--u); aspect-ratio:650/1004;   /* format du fichier Figma */
    transform-style:preserve-3d; cursor:pointer;
    transition:transform .7s cubic-bezier(.65,0,.35,1);
  }
  .pivot.retournee{transform:rotateY(180deg)}

  .face{
    position:absolute; inset:0; border-radius:var(--rayon);
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    box-shadow:0 26px 60px -18px rgba(42,15,46,.42), 0 4px 14px rgba(42,15,46,.14);
  }
  /* backface-visibility n'est pas fiable sur Safari iOS : on ne s'y fie plus.
     UNE SEULE face est rendue à tout instant. L'échange se fait à mi-rotation,
     quand la carte est de profil (largeur nulle) — donc invisible. */
  .recto{background:var(--aubergine); opacity:1}
  .pivot.montreVerso .recto{opacity:0}
  .pivot.montreVerso .verso{opacity:1}

  /* Calque de décor : c'est LUI qui rogne, pas la face —
     overflow:hidden sur une face casse son rendu 3D dans Safari. */
  .plan{position:absolute; inset:0; overflow:hidden; z-index:0}
  .verso{background:var(--lilas); transform:rotateY(180deg); opacity:0}

  /* Forme de fond — position et rotation reprises telles quelles du fichier Figma */
  /* Fond = rendu Figma du nœud Union (le « spark » agrandi), exporté en 2x.
     ⚠️ Le SVG exporté par Figma porte un flou gaussien de 25 qui N'EXISTE PAS
     dans le design : artefact d'export. Il donnait des arêtes molles et
     coûtait cher à rastériser à chaque frame de rotation. Ne pas y revenir.
     ⚠️ L'image est OPAQUE, la couleur de fond y est incorporée : si tu changes
     --aubergine ou --lilas, il faut réexporter depuis Figma.
     Calage vérifié numériquement : 0,0 · pleine largeur (erreur 0,03/255). */
  .forme{position:absolute; left:0; top:0; width:100%; height:auto; pointer-events:none}

  /* ---------- Lumière (voir README pour le principe) ---------- */
  .balayage{
    position:absolute; top:-25%; bottom:-25%; left:0; width:38%; z-index:2;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
    pointer-events:none; animation:balayage 1.6s cubic-bezier(.4,0,.3,1) .45s both;
  }

  /* ---------- Recto ---------- */
  .recto > :not(.plan){position:absolute; z-index:3}

  .photo{
    left:13.077%; top:11.255%; width:34.615%; aspect-ratio:225/254;
    animation:monte .8s cubic-bezier(.16,1,.3,1) .30s both;
  }
  /* Le recadrage est appliqué en amont par build-photo.py : le navigateur
     n'a plus d'image surdimensionnée à réduire pendant la rotation. */
  .photo img{width:100%; height:100%; object-fit:cover; display:block}

  .identite{
    left:13.077%; top:45.02%; color:var(--blanc);
    font-size:calc(var(--u) * .0738); font-weight:500;
    line-height:1.2; letter-spacing:-.015em;
    animation:monte .8s cubic-bezier(.16,1,.3,1) .42s both;
  }
  .identite .poste{color:var(--bloom-vif)}

  .coordonnees{
    left:13.077%; top:67.43%; color:var(--blanc);
    font-size:calc(var(--u) * .0492); font-weight:400;
    line-height:1.32; display:flex; flex-direction:column;
    animation:monte .8s cubic-bezier(.16,1,.3,1) .54s both;
  }

  .logo{
    left:13.077%; top:86.85%; width:29.077%;
    animation:monte .8s cubic-bezier(.16,1,.3,1) .66s both;
  }
  .logo img{width:100%; height:auto; display:block}

  /* ---------- Verso ---------- */
  .verso > :not(.plan){position:absolute; z-index:3}
  .cadre-qr{
    left:16.769%; top:28.586%; width:66.462%; aspect-ratio:1;
    background:var(--blanc); padding:7%;
  }
  .cadre-qr img{width:100%; height:100%; display:block}
  .scannez{
    left:0; right:0; top:72.9%; text-align:center;
    font-size:calc(var(--u) * .0554); font-weight:500;
    color:var(--aubergine); letter-spacing:-.01em;
  }
  .verso .logo{left:50%; top:86.85%; transform:translateX(-50%); animation:none}

  /* ===================== Actions ===================== */
  .actions{
    display:flex; flex-direction:column; align-items:center; gap:12px; z-index:1;
    animation:monte .8s cubic-bezier(.16,1,.3,1) .78s both;
  }
  .bouton{
    display:inline-block; padding:14px 28px; border-radius:var(--rayon);
    background:var(--aubergine); color:var(--blanc);
    font-family:var(--police); font-size:14px; font-weight:500; letter-spacing:-.01em;
    text-decoration:none; transition:opacity .15s ease, transform .15s ease;
  }
  .bouton:active{transform:scale(.98); opacity:.9}
  .indice{font-size:12px; color:rgba(42,15,46,.55); text-align:center}

  @media (prefers-reduced-motion:reduce){
    .entree,.photo,.identite,.coordonnees,.logo,.actions{animation:none}
    .balayage{display:none}
    .pivot{transition:none}
  }
</style>
</head>
<body>

  <!-- .entree est À L'EXTÉRIEUR de .scene : elle anime l'opacité, ce qui
       aplatirait le contexte 3D et ferait réapparaître la face arrière. -->
  <div class="entree">
    <div class="scene">
      <div class="pivot" id="carte" role="button" tabindex="0" aria-label="Retourner la carte">

        <div class="face recto">
          <div class="plan">
            <img class="forme" src="assets/forme-recto.webp" alt="">
            <div class="balayage"></div>
          </div>

          <div class="photo"><img src="assets/photo-romain.webp" alt="Romain Legresy" decoding="sync" fetchpriority="high"></div>
          <div class="identite">
            <div>Romain Legresy</div>
            <div class="poste">Chief Operations<br>Officer</div>
          </div>
          <div class="coordonnees">
            <span>+33 6 68 83 90 00</span>
            <span>romain.legresy@visma.com</span>
          </div>
          <div class="logo"><img src="assets/logo-blanc.svg" alt="Inqom by Visma"></div>
        </div>

        <div class="face verso">
          <div class="plan">
            <img class="forme" src="assets/forme-verso.webp" alt="">
          </div>

          <div class="cadre-qr"><img src="qr.svg" alt="QR code vers la carte"></div>
          <div class="scannez">Scannez-moi</div>
          <div class="logo"><img src="assets/logo-sombre.svg" alt="Inqom by Visma"></div>
        </div>

      </div>
    </div>
  </div>

  <div class="actions">
    <a class="bouton" href="contact.vcf">Ajouter à mes contacts</a>
    <span class="indice">Touchez la carte pour la retourner</span>
  </div>

<script>
(() => {
  const carte  = document.getElementById('carte');


  carte.addEventListener('touchmove',  e => suivre(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  carte.addEventListener('touchend',   () => { doigt = false; relache = performance.now(); }, {passive:true});
  window.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    relache = performance.now();
    suivre(e.clientX, e.clientY);
  }, {passive:true});

  const DUREE_ROTATION = 700;   // doit rester égal à la transition de .pivot
  let bascule = null;
  /* ?perf — mesure le temps réel des frames pendant un retournement.
     Sert à trancher entre « ça rame » et « ça ne rame pas », sur le vrai
     appareil, plutôt qu'à optimiser au jugé. */
  const PERF = new URLSearchParams(location.search).has('perf');
  let sonde = null, panneau = null;
  if (PERF) {
    panneau = document.createElement('div');
    panneau.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:999;'+
      'background:#08080a;color:#4ad991;font:11px/1.5 ui-monospace,monospace;'+
      'padding:8px 10px;white-space:pre-wrap';
    panneau.textContent='mesure : retournez la carte';
    document.body.appendChild(panneau);
  }
  const demarrerSonde = () => {
    if (!PERF) return;
    const t = [];
    let precedent = performance.now();
    sonde = { t, actif:true };
    const pas = () => {
      const n = performance.now();
      t.push(n - precedent); precedent = n;
      if (sonde.actif) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
    setTimeout(() => {
      sonde.actif = false;
      const tri = [...t].sort((a,b)=>a-b);
      const med = tri[Math.floor(tri.length/2)] || 0;
      const pire = tri[tri.length-1] || 0;
      const lentes = t.filter(d => d > 32).length;
      panneau.textContent =
        `${t.length} frames · médiane ${med.toFixed(1)} ms · pire ${pire.toFixed(1)} ms\n` +
        `frames > 32 ms : ${lentes}  (0 = fluide)  ·  ~${(1000/med).toFixed(0)} i/s`;
    }, DUREE_ROTATION + 150);
  };

  const retourner = () => {
    demarrerSonde();
    carte.classList.toggle('retournee');                 // lance la rotation
    clearTimeout(bascule);
    // Échange des faces au moment exact du profil. La courbe est symétrique,
    // donc 50 % du mouvement = 50 % de la durée.
    bascule = setTimeout(() => carte.classList.toggle('montreVerso'),
                         DUREE_ROTATION / 2);
  };
  carte.addEventListener('click', retourner);
  carte.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); retourner(); }
  });
})();
</script>
</body>
</html>
