<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Prénom Nom — Carte</title>

<!-- Écran d'accueil : plein écran, sans barre Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prénom Nom">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* ================= Jetons ================= */
  :root{
    --encre:#08080a;
    --carte:#141418;
    --carte-haut:#20202a;
    --texte:#f4f4f6;
    --attenue:#8b8b96;
    --filet:rgba(255,255,255,.13);
    --rayon:10px;        /* 0 pour des angles vifs */
    --mx:0; --my:0;      /* inclinaison normalisée -1..1 */
    --force:.22;         /* intensité au repos */
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--encre); color:var(--texte);
    font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(20px,5vh,40px);
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  body::before{                       /* halo de scène, suit l'inclinaison */
    content:""; position:fixed; inset:-30%;
    background:radial-gradient(circle at calc(50% + var(--mx)*16%) calc(42% + var(--my)*16%),
               rgba(110,125,255,.14), transparent 58%);
    pointer-events:none; transition:background .3s ease-out;
  }

  /* ================= Carte ================= */
  .scene{perspective:1500px; perspective-origin:50% 45%}
  .inclinaison{
    transform:rotateY(calc(var(--mx) * 9deg)) rotateX(calc(var(--my) * -9deg));
    transition:transform .14s ease-out; transform-style:preserve-3d;
  }
  .pivot{
    position:relative; width:min(78vw,340px); aspect-ratio:55/85;
    transform-style:preserve-3d; cursor:pointer;
    transition:transform .8s cubic-bezier(.2,.85,.2,1);
  }
  .pivot.retournee{transform:rotateY(180deg)}

  .face{
    position:absolute; inset:0; overflow:hidden;
    border-radius:var(--rayon);
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    background:linear-gradient(157deg,var(--carte-haut),var(--carte) 58%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.1) inset,
      0 20px 55px -14px rgba(0,0,0,.9),
      0 2px 8px rgba(0,0,0,.55);
  }
  .face.verso{transform:rotateY(180deg)}

  /* ---------- Matière holographique (sous le texte) ---------- */
  .foil,.lavis,.reflet{
    position:absolute; inset:-20%; pointer-events:none;
    z-index:0; will-change:background-position,opacity;
  }
  /* bandes fines : c'est ce qui « fait » le vernis */
  .foil{
    background:repeating-linear-gradient(103deg,
      rgba(255,255,255,0)   0px,
      rgba(255,90,190,.34)  9px,
      rgba(255,255,255,0)   19px,
      rgba(255,205,80,.30)  29px,
      rgba(255,255,255,0)   39px,
      rgba(80,235,255,.34)  49px,
      rgba(255,255,255,0)   60px);
    background-position:calc(50% + var(--mx)*150px) calc(50% + var(--my)*150px);
    /* le vernis ne s'allume QUE là où la lumière frappe — c'est ce masque
       mobile qui distingue un vrai foil d'un motif rayé imprimé. */
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at calc(50% + var(--mx)*45%) calc(50% + var(--my)*45%),
                       #000 0%, rgba(0,0,0,.45) 38%, transparent 68%);
            mask-image:radial-gradient(ellipse 70% 55% at calc(50% + var(--mx)*45%) calc(50% + var(--my)*45%),
                       #000 0%, rgba(0,0,0,.45) 38%, transparent 68%);
    mix-blend-mode:screen;
    opacity:calc(var(--force) * .42);
    transition:background-position .14s ease-out, opacity .3s ease-out,
               -webkit-mask-image .14s ease-out, mask-image .14s ease-out;
  }
  /* lavis large : donne la dominante colorée */
  .lavis{
    background:repeating-linear-gradient(103deg,
      transparent 0%,
      rgba(255,0,132,.5) 9%, rgba(255,205,60,.5) 17%,
      rgba(60,255,180,.5) 25%, rgba(70,170,255,.5) 33%,
      transparent 42%);
    background-size:280% 280%;
    background-position:calc(50% + var(--mx)*50%) calc(50% + var(--my)*50%);
    mix-blend-mode:color-dodge;
    opacity:calc(var(--force) * .11);
    transition:background-position .14s ease-out, opacity .3s ease-out;
  }
  /* spéculaire : le point de lumière */
  .reflet{
    background:radial-gradient(circle at calc(50% + var(--mx)*38%) calc(50% + var(--my)*38%),
              rgba(255,255,255,.34), rgba(255,255,255,.04) 38%, transparent 60%);
    mix-blend-mode:soft-light;
    opacity:calc(.35 + var(--force)*.65);
    transition:background .14s ease-out;
  }

  /* ---------- Contenu : toujours au-dessus de la matière ---------- */
  .contenu{
    position:relative; z-index:2; height:100%;
    padding:clamp(24px,7%,32px);
    display:flex; flex-direction:column;
  }
  .marque{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--attenue)}
  .identite{margin-top:auto}
  .identite h1{font-size:clamp(28px,8.4vw,36px); line-height:1.02; font-weight:600; letter-spacing:-.025em}
  .identite h1 span{display:block; font-weight:300; color:var(--attenue)}
  .identite p{
    margin-top:14px; padding-top:14px; border-top:1px solid var(--filet);
    font-size:13px; color:var(--attenue);
  }
  .coordonnees{margin-top:20px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--attenue)}
  .coordonnees a{color:inherit; text-decoration:none}

  .verso .contenu{align-items:center; justify-content:center; gap:20px}
  .cadre-qr{background:#fff; padding:14px; border-radius:6px; line-height:0}
  .cadre-qr img{width:min(42vw,158px); height:auto; display:block}
  .verso .contenu p{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--attenue)}

  /* ================= Actions ================= */
  .actions{display:flex; flex-direction:column; align-items:center; gap:14px; z-index:1}
  .bouton{
    display:inline-block; padding:14px 26px;
    background:var(--texte); color:var(--encre);
    font-size:14px; font-weight:590; letter-spacing:-.01em;
    text-decoration:none; border-radius:100px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .bouton:active{transform:scale(.97); opacity:.9}
  .indice{font-size:12px; color:var(--attenue)}

  @media (prefers-reduced-motion:reduce){
    .inclinaison,.pivot,.foil,.lavis,.reflet{transition:none}
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="inclinaison">
      <div class="pivot" id="carte" role="button" tabindex="0" aria-label="Retourner la carte">

        <div class="face recto">
          <div class="foil"></div><div class="lavis"></div><div class="reflet"></div>
          <div class="contenu">
            <div class="marque">Société</div>
            <div class="identite">
              <h1>Prénom<span>Nom</span></h1>
              <p>Directeur artistique</p>
            </div>
            <div class="coordonnees">
              <a href="mailto:prenom.nom@societe.com">prenom.nom@societe.com</a>
              <a href="tel:+33600000000">+33 6 00 00 00 00</a>
            </div>
          </div>
        </div>

        <div class="face verso">
          <div class="foil"></div><div class="lavis"></div><div class="reflet"></div>
          <div class="contenu">
            <div class="cadre-qr"><img src="qr.svg" alt="QR code vers la carte"></div>
            <p>Scannez-moi</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="actions">
    <a class="bouton" href="contact.vcf">Ajouter à mes contacts</a>
    <span class="indice" id="indice">Touchez la carte pour la retourner</span>
  </div>

<script>
(() => {
  const racine = document.documentElement;
  const carte  = document.getElementById('carte');
  const indice = document.getElementById('indice');

  const borne   = (v,a,b) => Math.min(b, Math.max(a, v));
  const REPOS   = .22;                 // intensité quand rien ne bouge
  let   pilote  = null;                // 'gyro' | 'pointeur' | 'doigt'

  const applique = (mx,my,force) => {
    racine.style.setProperty('--mx', mx.toFixed(3));
    racine.style.setProperty('--my', my.toFixed(3));
    racine.style.setProperty('--force', force.toFixed(3));
  };

  /* ---- Animation de repos : la carte respire tant que rien ne la pilote ---- */
  const depart = performance.now();
  (function respire(t){
    if (!pilote) {
      const p = (t - depart) / 5200;
      applique(Math.sin(p * 2 * Math.PI) * .45,
               Math.cos(p * 2 * Math.PI) * .3,
               REPOS);
    }
    requestAnimationFrame(respire);
  })(depart);

  /* ---- Retournement ---- */
  const retourner = () => carte.classList.toggle('retournee');
  carte.addEventListener('click', retourner);
  carte.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); retourner(); }
  });

  /* ---- Gyroscope : la carte accroche la lumière quand on incline ---- */
  let repos = null;
  const surOrientation = e => {
    if (e.gamma == null || e.beta == null) return;
    if (repos === null) repos = { g:e.gamma, b:e.beta };
    pilote = 'gyro';
    const mx = borne((e.gamma - repos.g) / 30, -1, 1);
    const my = borne((e.beta  - repos.b) / 30, -1, 1);
    applique(mx, my, Math.max(REPOS, Math.min(1, Math.hypot(mx,my))));
  };

  const besoinPermission =
    typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';

  const activerGyro = async () => {
    try {
      if (besoinPermission && await DeviceOrientationEvent.requestPermission() !== 'granted') return false;
      window.addEventListener('deviceorientation', surOrientation);
      return true;
    } catch { return false; }
  };

  if (besoinPermission) {
    // iOS 13+ : la permission doit partir d'un geste. On l'accroche au 1er contact.
    document.body.addEventListener('pointerdown', async function once(){
      document.body.removeEventListener('pointerdown', once);
      if (await activerGyro()) indice.textContent = 'Inclinez le téléphone';
    }, { once:true });
  } else {
    activerGyro();
  }

  /* ---- Repli 1 : souris (bureau) ---- */
  window.addEventListener('pointermove', e => {
    if (pilote === 'gyro' || e.pointerType !== 'mouse') return;
    pilote = 'pointeur';
    const mx = (e.clientX / innerWidth  - .5) * 2;
    const my = (e.clientY / innerHeight - .5) * 2;
    applique(mx, my, Math.max(REPOS, Math.min(1, Math.hypot(mx,my))));
  }, { passive:true });

  /* ---- Repli 2 : glisser du doigt (tactile sans gyroscope) ---- */
  carte.addEventListener('touchmove', e => {
    if (pilote === 'gyro') return;
    pilote = 'doigt';
    const t = e.touches[0], r = carte.getBoundingClientRect();
    const mx = borne(((t.clientX - r.left) / r.width  - .5) * 2, -1, 1);
    const my = borne(((t.clientY - r.top ) / r.height - .5) * 2, -1, 1);
    applique(mx, my, Math.max(REPOS, Math.min(1, Math.hypot(mx,my))));
  }, { passive:true });
})();
</script>
</body>
</html>
